<style>
/* Layout: year of month cards on the left, a sticky day/recipe panel on the right (bottom sheet on phones). Talavera cobalt on tile white, dried-chile red for heat and cheat nights. */
:root {
  --bg: #f4f6fb; --surface: #ffffff; --sunk: #eaeef7; --ink: #18203d; --muted: #5a6382; --line: #dce1ee;
  --cobalt: #2446a6; --cobalt-soft: #dfe6fb; --chile: #b9341d; --chile-soft: #fbe3dc; --good: #2c7a4b;
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1329; --surface: #161b35; --sunk: #1d2343; --ink: #e7eaf6; --muted: #9aa2c3; --line: #2a3158;
  --cobalt: #93abff; --cobalt-soft: #253063; --chile: #ff8566; --chile-soft: #44241f; --good: #72d29a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1329; --surface: #161b35; --sunk: #1d2343; --ink: #e7eaf6; --muted: #9aa2c3; --line: #2a3158;
  --cobalt: #93abff; --cobalt-soft: #253063; --chile: #ff8566; --chile-soft: #44241f; --good: #72d29a; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; border-radius: 6px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.top-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; max-width: 1600px; margin: 0 auto; }
.brand { font-family: var(--f-display); font-size: 1.3rem; line-height: 1.1; margin: 0; text-wrap: balance; }
.brand small { display: block; font-family: var(--f-body); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.targets { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: .8rem; padding: 3px 9px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.nav { display: flex; gap: 6px; margin-left: auto; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: .9rem; }
.btn:hover { border-color: var(--cobalt); color: var(--cobalt); }
.btn.primary { background: var(--cobalt); border-color: var(--cobalt); color: var(--surface); }
.btn.primary:hover { color: var(--surface); filter: brightness(1.08); }

.wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; max-width: 1600px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; }
@media (min-width: 1100px) { .wrap { grid-template-columns: minmax(0, 1fr) 420px; } }

.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .8rem; color: var(--muted); margin-bottom: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--chile); display: inline-block; }
.ring { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--cobalt); display: inline-block; }

.months { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.month { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 12px 10px; scroll-margin: 90px; }
.month.now { border-color: var(--cobalt); box-shadow: 0 0 0 1px var(--cobalt); }
.month h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.15rem; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
.month h2 span { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.grid { display: grid; grid-template-columns: 26px repeat(7, minmax(0, 1fr)); gap: 3px; }
.wd { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: center; padding-bottom: 2px; }
.wk { font-family: var(--f-mono); font-size: .68rem; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 0; border-radius: 6px; }
.wk:hover, .wk.sel { color: var(--cobalt); background: var(--cobalt-soft); }
.d { position: relative; aspect-ratio: 1 / 1; max-width: 100%; border: 0; background: var(--sunk); border-radius: 7px; cursor: pointer;
  font-variant-numeric: tabular-nums; font-size: .88rem; display: flex; align-items: center; justify-content: center; min-height: 34px; }
.d:hover { background: var(--cobalt-soft); }
.d.blank { background: none; cursor: default; }
.d.past { color: var(--muted); }
.d.cheat::after { content: ""; position: absolute; bottom: 4px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--chile); }
.d.today { box-shadow: inset 0 0 0 2px var(--cobalt); font-weight: 700; }
.d.sel { background: var(--cobalt); color: var(--surface); }
.d.sel.cheat::after { background: var(--surface); }
.d:disabled { opacity: .35; cursor: default; }

/* Panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
@media (min-width: 1100px) { .panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); max-height: calc(100vh - 96px); overflow: auto; } .sheet-close, .backdrop { display: none !important; } }
@media (max-width: 1099px) {
  .panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; max-height: 88vh; overflow: auto; border-radius: 16px 16px 0 0;
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
    transform: translateY(105%); transition: transform .34s cubic-bezier(.2,.9,.25,1); box-shadow: 0 -8px 30px rgba(0,0,0,.18);
    overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .panel.open { transform: none; }
  /* Grab handle; it stays at the top while the sheet scrolls. */
  .panel::before { content: ""; display: block; position: sticky; top: 0; z-index: 2; height: 22px; margin-bottom: -22px; border-radius: 16px 16px 0 0;
    background: radial-gradient(closest-side, var(--line) 99%, transparent) center 9px / 40px 5px no-repeat; }
  .backdrop { position: fixed; inset: 0; z-index: 35; background: rgba(10, 14, 35, .45); transition: opacity .3s ease; touch-action: none; }
}
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
.p-in { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.p-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.p-title { font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; line-height: 1.15; margin: 2px 0 0; text-wrap: balance; }
.sheet-close { border: 0; background: var(--sunk); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; flex: none; font-size: 1.1rem; }
.back { align-self: flex-start; border: 0; background: none; color: var(--cobalt); cursor: pointer; padding: 0; font-weight: 600; }

.people { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.person { background: var(--sunk); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.person .lbl { font-size: .75rem; color: var(--muted); }
.person .num { font-family: var(--f-mono); font-size: 1.15rem; font-weight: 500; }
.person .num small { font-size: .75rem; color: var(--muted); }

.meal:hover { border-color: var(--cobalt); }

.meal .name { font-weight: 600; min-width: 0; }
.meal .go { color: var(--cobalt); align-self: center; }
.meal .meta { grid-column: 1 / -1; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { font-size: .68rem; padding: 1px 7px; border-radius: 99px; text-transform: uppercase; letter-spacing: .05em; }

.snacks { border-top: 1px dashed var(--line); padding-top: 12px; font-size: .88rem; }

.snacks ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }

.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.split .person b { display: block; font-size: .95rem; }
.ing { list-style: none; margin: 0; padding: 0; }
.ing li { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.ing .amt { font-family: var(--f-mono); font-size: .82rem; text-align: right; color: var(--ink); }
.ing .fi { color: var(--muted); font-size: .78rem; }
.ing .note { color: var(--muted); }
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; max-width: 65ch; }
.steps li::marker { font-family: var(--f-mono); color: var(--cobalt); }
.note-box { font-size: .85rem; background: var(--sunk); border-radius: 8px; padding: 9px 12px; }
.swap-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; min-width: 0; flex: 1; }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .85rem; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
tr.avg td { font-weight: 700; border-bottom: 0; }
td button { border: 0; background: none; color: var(--cobalt); cursor: pointer; padding: 0; font-weight: 600; }
.shop h4 { margin: 10px 0 2px; font-size: .85rem; }
.shop ul { list-style: none; margin: 0; padding: 0; font-size: .88rem; }
.shop li { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; border-bottom: 1px solid var(--line); }
.shop li > span:last-child { font-family: var(--f-mono); font-size: .8rem; white-space: nowrap; }
.pantry { font-size: .85rem; color: var(--muted); }
.empty { color: var(--muted); font-size: .9rem; }
.zoombar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: .9rem; min-width: 0; }
.crumbs button { border: 0; background: none; padding: 3px 6px; border-radius: 6px; cursor: pointer; color: var(--cobalt); font-weight: 600; }
.crumbs button[aria-current] { color: var(--ink); cursor: default; }
.crumbs .sep { color: var(--muted); }
.zoom-btns { display: flex; gap: 6px; flex: none; }

.cal { touch-action: pan-y; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 84px); }
.pinch-target { outline: 2px solid var(--cobalt); outline-offset: 2px; transition: outline-color .1s; }

.cal { position: relative; overflow-x: clip; }
@supports not (overflow: clip) { .cal { overflow-x: hidden; } }
.pager { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; }
.prep { pointer-events: none; }
.ghost { pointer-events: none; z-index: 15; }
.ghost > * { margin: 0; }
/* Off-screen months skip layout and paint until they scroll into view. */
.month { content-visibility: auto; contain-intrinsic-size: auto 330px; }
.ag { content-visibility: auto; contain-intrinsic-size: auto 66px; }
.dmeal { content-visibility: auto; contain-intrinsic-size: auto 240px; }
.dc { contain: layout paint; }
/* iPhone tap feel: no grey flash or double-tap zoom delay, a pressed state instead. */
button, .d, .dc, .ag, .meal { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.d:active, .dc:active, .ag:active, .meal:active, .btn:active, .wk:active { transform: scale(.96); transition: transform .08s; }

    h += '<p class="kcal">Pack sizes are the cheapest mix that covers the week. Includes the morning juice and both optional snacks for two people each day.</p><h4>Check the pantry</h4><p class="pantry">' + pk.map(esc).join(", ") + "</p></div>";
    text.push("PANTRY: " + pk.join(", "));
    text.push("Expected checkout ≈ " + eur(total));
    state.shopText = "Week " + isoWeek(mon.y, mon.m, mon.d) + "\n" + text.join("\n");
    return h + priceNote() + "</div>";
  }

  function viewMonth() {
    var y = state.month.y, m = state.month.m, mp = monthPlans(y, m);
    var h = '<div class="p-in"><div class="p-head"><div><div class="eyebrow">Month summary</div><h2 class="p-title">' + MONTHS[m] + " " + y + '</h2></div><button class="sheet-close" data-close aria-label="Close">×</button></div>';
    if (!mp.length) return h + '<p class="empty">No plan for this month.</p></div>';
    var c = 0, p1 = 0, p2 = 0, cheat = 0, weeks = {};
    mp.forEach(function (x) {
      c += x.pl.cost; p1 += x.pl.people.p1.p; p2 += x.pl.people.p2.p; if (x.pl.cheat) cheat++;
      var mo = mondayOf(x.o), k = mo.y + "," + mo.m + "," + mo.d;
      weeks[k] = weeks[k] || { mon: mo, c: 0, n: 0 }; weeks[k].c += x.pl.cost; weeks[k].n++;
    });
    var n = mp.length;
    h += '<div class="people"><div class="person"><div class="lbl">Food cost this month</div><div class="num">≈ ' + eur(c, 0) + '</div><div class="kcal">' + eur(c / n) + ' a day on average</div></div>' +
      '<div class="person"><div class="lbl">Protein, daily average</div><div class="num">' + r0(p1 / n) + ' <small>/ ' + r0(p2 / n) + ' g</small></div><div class="kcal">' + PEOPLE.p1.label + " / " + PEOPLE.p2.label + " · " + cheat + " cheat nights</div></div></div>";
    h += '<div class="tbl-wrap"><table><thead><tr><th>Week</th><th>Days in month</th><th>Cost</th></tr></thead><tbody>';
    Object.keys(weeks).forEach(function (k) {
      var w = weeks[k];
      h += '<tr><td><button data-wk="' + k + '">Week ' + isoWeek(w.mon.y, w.mon.m, w.mon.d) + "</button></td><td>" + w.n + "</td><td>" + eur(w.c) + "</td></tr>";
    });
    h += "</tbody></table></div>";
    return h + priceNote() + "</div>";
  }

  // On phones the panel is a sheet that is usually closed: render it when it opens.
  var panelDirty = true;
  function sheetOpen() { return mq.matches || $("panel").classList.contains("open"); }
  function renderPanel(force) {
    if (!force && !sheetOpen()) { panelDirty = true; return; }
    panelDirty = false;
    var p = $("panel");
    p.innerHTML = state.view === "recipe" ? viewRecipe() : state.view === "week" ? viewWeek() : state.view === "month" ? viewMonth() : viewDay();
    p.scrollTop = 0;
    var sel = $("swap-sel");
    if (sel) sel.addEventListener("change", function () {
      var o = state.sel, k = Engine.key(o.y, o.m, o.d) + "|" + state.recipe, base = dayPlan(o).base[state.recipe].id;
      if (sel.value === base) delete ov[k]; else ov[k] = sel.value;
      saveOv(); renderMonths(); renderPanel();
    });
    var cp = $("copy");
    if (cp) cp.addEventListener("click", function () {
      var done = function () { cp.textContent = "Copied"; setTimeout(function () { cp.textContent = "Copy list"; }, 1500); };
      try { navigator.clipboard.writeText(state.shopText).then(done, function () { cp.textContent = "Copy not available"; }); } catch (e) { cp.textContent = "Copy not available"; }
    });
  }

  var mq = window.matchMedia("(min-width: 1100px)");
  function onBreakpoint() { if (state.level === "month") renderMonths(); }
  if (window.matchMedia("(max-width: 640px)").addEventListener) window.matchMedia("(max-width: 640px)").addEventListener("change", onBreakpoint);
  var bdTimer = 0;
  function openSheet(v) {
    if (mq.matches) return;
    var p = $("panel"), bd = $("backdrop");
    if (v && panelDirty) renderPanel(true);
    if (v === p.classList.contains("open")) return;
    clearTimeout(bdTimer);
    p.classList.toggle("open", v);
    if (v) { bd.hidden = false; bd.style.opacity = "0"; void bd.offsetWidth; bd.style.opacity = ""; }
    else { bd.style.opacity = "0"; bdTimer = setTimeout(function () { bd.hidden = true; bd.style.opacity = ""; }, 300); }
  }

  // ---- Phone sheet: swipe down to close, background stays still -----------------
  // Pulling down when the sheet is scrolled to its top (or from the handle) drags the
  // sheet with the finger; letting go past a quarter of its height, or with a flick,
  // closes it. Touches on the sheet or the dimmed area never scroll the page behind.
  (function () {
    var panel = $("panel"), bd = $("backdrop"), drag = null;
    function sheetUp() { return !mq.matches && panel.classList.contains("open"); }
    bd.addEventListener("touchmove", function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
    panel.addEventListener("touchstart", function (e) {
      if (!sheetUp() || e.touches.length !== 1) { drag = null; return; }
      var t = e.touches[0], r = panel.getBoundingClientRect();
      drag = { x0: t.clientX, y0: t.clientY, y: 0, base: 0, active: false, s: [], h: r.height, handle: t.clientY - r.top < 30 };
    }, { passive: true });
    panel.addEventListener("touchmove", function (e) {
      if (!drag || !sheetUp() || e.touches.length !== 1) return;
      var t = e.touches[0], dy = t.clientY - drag.y0, dx = t.clientX - drag.x0;
      var atTop = panel.scrollTop <= 0, atEnd = panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 1;
      if (!drag.active) {
        if ((atTop || drag.handle) && dy > 6 && dy > Math.abs(dx)) {
          drag.active = true; drag.base = dy;
          panel.style.transition = "none"; bd.style.transition = "none";
        } else {
          // At either end of the sheet's own scroll, stop the page behind from taking over.
          if ((dy > 0 && atTop) || (dy < 0 && atEnd)) { if (e.cancelable) e.preventDefault(); }
          return;
        }
      }
      if (e.cancelable) e.preventDefault();
      var y = dy - drag.base;
      if (y < 0) y = y * 0.25; // a little give upwards, like iOS
      drag.y = y; sample(drag.s, y);
      panel.style.transform = "translateY(" + y + "px)";
      bd.style.opacity = String(Math.max(0, 1 - Math.max(0, y) / drag.h));
    }, { passive: false });
    function end() {
      if (!drag) return;
      var d = drag; drag = null;
      if (!d.active) return;
      var v = velocity(d.s), close = d.y > d.h * 0.25 || (v > 0.5 && d.y > 10);
      if (close) {
        // Finish at the flick's speed.
        var rest = Math.max(0, d.h - d.y), ms = Math.max(140, Math.min(320, v > 0.1 ? rest / v : 300));
        panel.style.transition = "transform " + ms + "ms cubic-bezier(.25,.8,.25,1)"; bd.style.transition = "opacity " + ms + "ms ease";
        panel.style.transform = "";
        openSheet(false);
        setTimeout(function () { panel.style.transition = ""; bd.style.transition = ""; }, ms + 20);
      } else {
        panel.style.transition = ""; bd.style.transition = "";
        panel.style.transform = ""; bd.style.opacity = "";
      }
    }
    panel.addEventListener("touchend", end);
    panel.addEventListener("touchcancel", end);
  })();

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-day],[data-wk],[data-month],[data-recipe],[data-back],[data-close],[data-reset],[data-level],#backdrop");
    if (!t) return;
    if (t.hasAttribute("data-level")) {
      var lv = t.getAttribute("data-level"); if (lv === state.level) return;
      if (lv === "year") setLevel("year", "zout"); else if (lv === "month") setLevel("month", state.level === "day" ? "zout" : "zin");
      return;
    }
    if (t.id === "backdrop" || t.hasAttribute("data-close")) { openSheet(false); return; }
    if (t.hasAttribute("data-day")) { var a = t.getAttribute("data-day").split(",").map(Number); state.sel = { y: a[0], m: a[1], d: a[2] }; state.view = "day"; }
    else if (t.hasAttribute("data-wk")) { var w = t.getAttribute("data-wk").split(",").map(Number); state.week = { y: w[0], m: w[1], d: w[2] }; state.view = "week"; }
    else if (t.hasAttribute("data-month")) { var mm = t.getAttribute("data-month").split(",").map(Number); state.month = { y: mm[0], m: mm[1] }; state.view = "month"; }
    else if (t.hasAttribute("data-recipe")) { if (state.view !== "recipe") state.prevView = state.view; state.recipe = t.getAttribute("data-recipe"); state.view = "recipe"; }
    else if (t.hasAttribute("data-back")) { state.view = state.prevView === "week" ? "week" : "day"; }
    else if (t.hasAttribute("data-reset")) { var o = state.sel; delete ov[Engine.key(o.y, o.m, o.d) + "|" + state.recipe]; saveOv(); }
    renderMonths(); panelDirty = true; if (mq.matches) renderPanel(); openSheet(true);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") openSheet(false); });

  function centerNow() {
    var t = new Date(TODAY.y, TODAY.m + state.offset, 1), el = $("m-" + t.getFullYear() + "-" + t.getMonth());
    if (el) el.scrollIntoView({ block: "center" });
  }
  $("prev").addEventListener("click", function () { step(-1); });
  $("next").addEventListener("click", function () { step(1); });
  $("zin").addEventListener("click", function () { zoomIn(null); });
  $("zout").addEventListener("click", function () { zoomOut(); });
  $("today").addEventListener("click", function () {
    state.offset = 0; state.sel = { y: TODAY.y, m: TODAY.m, d: TODAY.d }; state.focus = { y: TODAY.y, m: TODAY.m };
    if (state.level === "year") { state.view = "day"; renderMonths(); renderPanel(); centerNow(); openSheet(true); }
    else { saveLevel(); renderMonths(); renderPanel(); animate(); }
  });

  // ---- Gestures: pinch to change level, swipe to page, taps unchanged -------
  // Touch events: the second finger can claim the gesture before the browser starts
  // scrolling. During a pinch the view follows the fingers 1:1; the level change on
  // release continues from where the fingers left it.
  var cal = $("cal"), g = null, raf = 0, suppressUntil = 0, wheelAcc = 0, wheelLock = 0, tgtEl = null;
  var PINCH_IN = 1.25, PINCH_OUT = 0.8;
  function tdist(a, b) { return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }
  function soft(r) { return r > 2.2 ? 2.2 + (r - 2.2) * 0.25 : r < 0.5 ? 0.5 - (0.5 - r) * 0.25 : r; }
  function markTarget(el) { if (tgtEl) tgtEl.classList.remove("pinch-target"); tgtEl = el; }
  function sample(arr, v) { var t = performance.now(); arr.push([t, v]); while (arr.length > 4) arr.shift(); }
  function velocity(arr) { if (arr.length < 2) return 0; var a = arr[0], b = arr[arr.length - 1]; return b[0] > a[0] ? (b[1] - a[1]) / (b[0] - a[0]) : 0; }
  function paint() {
    raf = 0; if (!g) return;
    var m = $("months");
    if (g.mode === "pinch") {
      m.style.transformOrigin = g.ox + "px " + g.oy + "px";
      m.style.transform = "translate(" + (g.mx - g.mx0) + "px," + (g.my - g.my0) + "px) scale(" + soft(g.r) + ")";
      if (tgtEl) tgtEl.classList.toggle("pinch-target", g.r > 1.04);
      // Build the level the pinch is heading to while the fingers are still moving.
      if (g.r > 1.08 && state.level !== "day") prepareZoom("in", g.target);
      else if (g.r < 0.93 && state.level !== "year") prepareZoom("out", null);
    } else if (g.mode === "swipe" && g.lock === "x") pagerMove(g.dx);
  }
  function schedule() { if (!raf) raf = requestAnimationFrame(paint); }
  function settleBack() {
    var m = $("months"), tf = m.style.transform;
    m.style.transform = "";
    if (tf && m.animate && !reduceMotion()) m.animate([{ transform: tf }, { transform: "none" }], { duration: 260, easing: EASE });
    setTimeout(function () { m.style.transformOrigin = ""; }, 280);
  }

  cal.addEventListener("touchstart", function (e) {
    if (busy) { e.preventDefault(); return; }
    if (e.touches.length === 2) {
      if (g && g.mode === "swipe" && g.lock === "x") return;
      var a = e.touches[0], b = e.touches[1], mx = (a.clientX + b.clientX) / 2, my = (a.clientY + b.clientY) / 2;
      var m = $("months"), L = m.getBoundingClientRect();
      g = { mode: "pinch", d0: Math.max(tdist(a, b), 1), mx0: mx, my0: my, mx: mx, my: my, ox: mx - L.left, oy: my - L.top, r: 1, s: [] };
      g.target = targetAt(mx, my);
      markTarget(state.level === "day" ? null : anchorFor(state.level, g.target));
      m.style.willChange = "transform";
      e.preventDefault();
    } else if (e.touches.length === 1 && !g) {
      g = { mode: "swipe", x0: e.touches[0].clientX, y0: e.touches[0].clientY, dx: 0, dy: 0, lock: null, s: [] };
    }
  }, { passive: false });
  cal.addEventListener("touchmove", function (e) {
    if (!g) return;
    if (g.mode === "pinch" && e.touches.length >= 2) {
      var a = e.touches[0], b = e.touches[1];
      g.r = tdist(a, b) / g.d0; g.mx = (a.clientX + b.clientX) / 2; g.my = (a.clientY + b.clientY) / 2;
      sample(g.s, g.r); e.preventDefault(); schedule();
    } else if (g.mode === "swipe" && e.touches.length === 1) {
      g.dx = e.touches[0].clientX - g.x0; g.dy = e.touches[0].clientY - g.y0;
      if (!g.lock && (Math.abs(g.dx) > 8 || Math.abs(g.dy) > 8)) g.lock = Math.abs(g.dx) > Math.abs(g.dy) * 1.2 && state.level !== "year" ? "x" : "y";
      if (g.lock === "x") { sample(g.s, g.dx); e.preventDefault(); schedule(); }
    }
  }, { passive: false });
  function endTouch(e) {
    if (!g) return;
    if (g.mode === "pinch") {
      if (e.touches.length >= 2) return;
      cancelAnimationFrame(raf); raf = 0;
      var r = g.r, v = velocity(g.s) * 1000, tgt = g.target, lv = state.level;
      // The pinch transform as scale + offset with origin 0 0, so the zoom continues from it.
      var sc = soft(r), pin = { s: sc, cx: g.ox * (1 - sc) + (g.mx - g.mx0), cy: g.oy * (1 - sc) + (g.my - g.my0) };
      markTarget(null); $("months").style.willChange = ""; g = null; suppressUntil = Date.now() + 350;
      var goIn = lv !== "day" && (r >= PINCH_IN || (r > 1.06 && v > 1.2));
      var goOut = lv !== "year" && (r <= PINCH_OUT || (r < 0.95 && v < -1.2));
      if (goIn) zoomIn(tgt, pin); else if (goOut) zoomOut(pin); else { dropPrepared(); settleBack(); }
      return;
    }
    if (g.mode === "swipe") {
      var dx = g.dx, lock = g.lock, vx = velocity(g.s); g = null;
      if (lock !== "x") return;
      cancelAnimationFrame(raf); raf = 0; pagerMove(dx);
      suppressUntil = Date.now() + 350;
      var W = pager ? pager.W : 400, n = 0;
      if (Math.abs(dx) > W * 0.3 || (Math.abs(dx) > 24 && Math.abs(vx) > 0.35)) n = dx < 0 ? 1 : -1;
      if (n !== 0 && (dx < 0) !== (vx <= 0.05) && Math.abs(vx) > 0.35) n = 0; // flicked back the other way
      pagerFinish(n, n ? vx : 0);
    }
  }
  cal.addEventListener("touchend", endTouch);
  cal.addEventListener("touchcancel", function () {
    if (!g) return;
    var mode = g.mode; g = null; markTarget(null);
    if (mode === "pinch") { dropPrepared(); settleBack(); } else if (pager) pagerFinish(0, 0);
  });
  // Keep Safari's own page zoom out of the calendar, so the pinch reaches the app.
  ["gesturestart", "gesturechange"].forEach(function (n) { cal.addEventListener(n, function (e) { e.preventDefault(); }); });
  // A pinch or swipe never turns into a tap, and nothing is tappable mid-animation.
  document.addEventListener("click", function (e) { if ((busy || Date.now() < suppressUntil) && cal.contains(e.target)) { e.stopPropagation(); e.preventDefault(); } }, true);
  // Trackpad pinch and Ctrl + scroll.
  cal.addEventListener("wheel", function (e) {
    if (!e.ctrlKey) return;
    e.preventDefault();
    if (busy || Date.now() < wheelLock) return;
    wheelAcc += e.deltaY;
    if (wheelAcc < -40) { wheelAcc = 0; wheelLock = Date.now() + 450; zoomIn(targetAt(e.clientX, e.clientY)); }
    else if (wheelAcc > 40) { wheelAcc = 0; wheelLock = Date.now() + 450; zoomOut(); }
  }, { passive: false });
  document.addEventListener("keydown", function (e) {
    var tag = (e.target.tagName || "").toLowerCase();
    if (busy || tag === "select" || tag === "input" || tag === "textarea" || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "+" || e.key === "=") { e.preventDefault(); zoomIn(null); }
    else if (e.key === "-" || e.key === "_") { e.preventDefault(); zoomOut(); }
    else if (e.key === "ArrowLeft" && state.level !== "year") { e.preventDefault(); step(-1); }
    else if (e.key === "ArrowRight" && state.level !== "year") { e.preventDefault(); step(1); }
  });

  // Keep "today" right if the app stays open past midnight.
  function checkDate() {
    var n = todayObj(); if (same(n, TODAY)) return;
    var wasToday = same(state.sel, TODAY); TODAY = n;
    if (wasToday) { state.sel = { y: n.y, m: n.m, d: n.d }; if (state.level !== "day") state.focus = { y: n.y, m: n.m }; }
    renderMonths(); renderPanel();
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) checkDate(); });
  setInterval(checkDate, 60000);

  readLevel();
  if (location.hash || state.level !== "year") saveLevel(); // correct an invalid link in the address bar
  if (state.level === "day" && mq.matches) { state.view = "week"; state.week = mondayOf(state.sel); }
  renderMonths(); renderPanel();
  if (state.level === "year") requestAnimationFrame(centerNow);
  if (performance.mark) performance.mark("app-ready");
})();
</script>
