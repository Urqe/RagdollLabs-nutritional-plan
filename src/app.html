<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: year of month cards on the left, a sticky day/recipe panel on the right (bottom sheet on phones). Talavera cobalt on tile white, dried-chile red for heat and cheat nights. */
:root {
  --bg: #f4f6fb; --surface: #ffffff; --sunk: #eaeef7; --ink: #18203d; --muted: #5a6382; --line: #dce1ee;
  --cobalt: #2446a6; --cobalt-soft: #dfe6fb; --chile: #b9341d; --chile-soft: #fbe3dc; --good: #2c7a4b;
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1329; --surface: #161b35; --sunk: #1d2343; --ink: #e7eaf6; --muted: #9aa2c3; --line: #2a3158;
  --cobalt: #93abff; --cobalt-soft: #253063; --chile: #ff8566; --chile-soft: #44241f; --good: #72d29a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1329; --surface: #161b35; --sunk: #1d2343; --ink: #e7eaf6; --muted: #9aa2c3; --line: #2a3158;
  --cobalt: #93abff; --cobalt-soft: #253063; --chile: #ff8566; --chile-soft: #44241f; --good: #72d29a; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; border-radius: 6px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.top-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; max-width: 1600px; margin: 0 auto; }
.brand { font-family: var(--f-display); font-size: 1.3rem; line-height: 1.1; margin: 0; text-wrap: balance; }
.brand small { display: block; font-family: var(--f-body); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.targets { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: .8rem; padding: 3px 9px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.nav { display: flex; gap: 6px; margin-left: auto; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: .9rem; }
.btn:hover { border-color: var(--cobalt); color: var(--cobalt); }
.btn.primary { background: var(--cobalt); border-color: var(--cobalt); color: var(--surface); }
.btn.primary:hover { color: var(--surface); filter: brightness(1.08); }

.wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; max-width: 1600px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; }
@media (min-width: 1100px) { .wrap { grid-template-columns: minmax(0, 1fr) 420px; } }

.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .8rem; color: var(--muted); margin-bottom: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--chile); display: inline-block; }
.ring { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--cobalt); display: inline-block; }

.months { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.month { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 12px 10px; scroll-margin: 90px; }
.month.now { border-color: var(--cobalt); box-shadow: 0 0 0 1px var(--cobalt); }
.month h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.15rem; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
.month h2 span { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.grid { display: grid; grid-template-columns: 26px repeat(7, minmax(0, 1fr)); gap: 3px; }
.wd { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: center; padding-bottom: 2px; }
.wk { font-family: var(--f-mono); font-size: .68rem; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 0; border-radius: 6px; }
.wk:hover, .wk.sel { color: var(--cobalt); background: var(--cobalt-soft); }
.d { position: relative; aspect-ratio: 1 / 1; max-width: 100%; border: 0; background: var(--sunk); border-radius: 7px; cursor: pointer;
  font-variant-numeric: tabular-nums; font-size: .88rem; display: flex; align-items: center; justify-content: center; min-height: 34px; }
.d:hover { background: var(--cobalt-soft); }
.d.blank { background: none; cursor: default; }
.d.past { color: var(--muted); }
.d.cheat::after { content: ""; position: absolute; bottom: 4px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--chile); }
.d.today { box-shadow: inset 0 0 0 2px var(--cobalt); font-weight: 700; }
.d.sel { background: var(--cobalt); color: var(--surface); }
.d.sel.cheat::after { background: var(--surface); }
.d:disabled { opacity: .35; cursor: default; }

/* Panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
@media (min-width: 1100px) { .panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); max-height: calc(100vh - 96px); overflow: auto; } .sheet-close, .backdrop { display: none !important; } }
@media (max-width: 1099px) {
  .panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; max-height: 88vh; overflow: auto; border-radius: 16px 16px 0 0;
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
    transform: translateY(105%); transition: transform .22s ease; box-shadow: 0 -8px 30px rgba(0,0,0,.18); }
  .panel.open { transform: none; }
  .backdrop { position: fixed; inset: 0; z-index: 35; background: rgba(10, 14, 35, .45); }
}
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
.p-in { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.p-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.p-title { font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; line-height: 1.15; margin: 2px 0 0; text-wrap: balance; }
.sheet-close { border: 0; background: var(--sunk); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; flex: none; font-size: 1.1rem; }
.back { align-self: flex-start; border: 0; background: none; color: var(--cobalt); cursor: pointer; padding: 0; font-weight: 600; }

.people { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.person { background: var(--sunk); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.person .lbl { font-size: .75rem; color: var(--muted); }
.person .num { font-family: var(--f-mono); font-size: 1.15rem; font-weight: 500; }
.person .num small { font-size: .75rem; color: var(--muted); }
.bar { height: 5px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); }
.bar i.low { background: var(--chile); }
.kcal { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); margin-top: 4px; }

.meals { display: flex; flex-direction: column; gap: 8px; }
.meal { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface);
  border-radius: 9px; padding: 11px 12px; cursor: pointer; }
.meal:hover { border-color: var(--cobalt); }
.meal .slot { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; }
.meal .name { font-weight: 600; min-width: 0; }
.meal .go { color: var(--cobalt); align-self: center; }
.meal .meta { grid-column: 1 / -1; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { font-size: .68rem; padding: 1px 7px; border-radius: 99px; text-transform: uppercase; letter-spacing: .05em; }
.tag.cheat { background: var(--chile-soft); color: var(--chile); }
.tag.swap { background: var(--cobalt-soft); color: var(--cobalt); }
.heat { color: var(--chile); letter-spacing: 1px; }
.heat .off { color: var(--line); }

.snacks { border-top: 1px dashed var(--line); padding-top: 12px; font-size: .88rem; }
.snacks .kcal { display: block; }
.snacks h3, .sec h3 { font-size: .75rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
.snacks ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }

.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.split .person b { display: block; font-size: .95rem; }
.ing { list-style: none; margin: 0; padding: 0; }
.ing li { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.ing .amt { font-family: var(--f-mono); font-size: .82rem; text-align: right; color: var(--ink); }
.ing .fi { color: var(--muted); font-size: .78rem; }
.ing .note { color: var(--muted); }
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; max-width: 65ch; }
.steps li::marker { font-family: var(--f-mono); color: var(--cobalt); }
.note-box { font-size: .85rem; background: var(--sunk); border-radius: 8px; padding: 9px 12px; }
.swap-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; min-width: 0; flex: 1; }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .85rem; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
tr.avg td { font-weight: 700; border-bottom: 0; }
td button { border: 0; background: none; color: var(--cobalt); cursor: pointer; padding: 0; font-weight: 600; }
.shop h4 { margin: 10px 0 2px; font-size: .85rem; }
.shop ul { list-style: none; margin: 0; padding: 0; font-size: .88rem; }
.shop li { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; border-bottom: 1px solid var(--line); }
.shop li > span:last-child { font-family: var(--f-mono); font-size: .8rem; white-space: nowrap; }
.pantry { font-size: .85rem; color: var(--muted); }
.empty { color: var(--muted); font-size: .9rem; }
.zoombar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: .9rem; min-width: 0; }
.crumbs button { border: 0; background: none; padding: 3px 6px; border-radius: 6px; cursor: pointer; color: var(--cobalt); font-weight: 600; }
.crumbs button[aria-current] { color: var(--ink); cursor: default; }
.crumbs .sep { color: var(--muted); }
.zoom-btns { display: flex; gap: 6px; flex: none; }
.zoom-btns .btn { width: 38px; padding: 6px 0; font-size: 1.05rem; line-height: 1; }
.cal { touch-action: pan-y; transform-origin: 50% 0; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 84px); }
.cal.zin > * { animation: zin .22s ease-out; }
.cal.zout > * { animation: zout .22s ease-out; }
@keyframes zin { from { opacity: .4; transform: scale(.94); } to { opacity: 1; transform: none; } }
@keyframes zout { from { opacity: .4; transform: scale(1.05); } to { opacity: 1; transform: none; } }
@keyframes slidel { from { opacity: .4; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes slider { from { opacity: .4; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
.cal.sl > * { animation: slidel .2s ease-out; }
.cal.sr > * { animation: slider .2s ease-out; }
@media (prefers-reduced-motion: reduce) { .cal > * { animation: none !important; } }

/* Month level */
.mbig { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.mbig-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 10px; }
.mbig-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.6rem; margin: 0; }
.mbig-head span { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
.mgrid { display: grid; grid-template-columns: 26px repeat(7, minmax(0, 1fr)); gap: 4px; }
.dc { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 2px; text-align: left; min-height: 104px; min-width: 0;
  border: 1px solid transparent; background: var(--sunk); border-radius: 8px; padding: 5px 6px; cursor: pointer; font-size: .7rem; line-height: 1.25; overflow: hidden; }
.dc:hover { border-color: var(--cobalt); }
.dc.blank { background: none; cursor: default; border: 0; }
.dc .dn { font-family: var(--f-mono); font-size: .85rem; font-weight: 500; display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.dc .ml { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.dc .ml i { font-style: normal; color: var(--muted); font-family: var(--f-mono); margin-right: 3px; }
.dc .dp { margin-top: auto; font-family: var(--f-mono); font-size: .66rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dc .ct { width: 6px; height: 6px; border-radius: 50%; background: var(--chile); flex: none; }
.dc.today { box-shadow: inset 0 0 0 2px var(--cobalt); }
.dc.sel { background: var(--cobalt-soft); border-color: var(--cobalt); }
.dc.past { opacity: .75; }
.agenda { display: none; }
@media (max-width: 640px) {
  .targets { display: none; }
  .top { padding-block: 8px; }
  .brand { font-size: 1.1rem; }
}
@media (max-width: 640px) {
  .mgrid { display: none; }
  .mbig { padding: 12px; }
  .agenda { display: flex; flex-direction: column; gap: 6px; }
  .ag-wk { border: 0; background: none; text-align: left; padding: 8px 2px 2px; color: var(--cobalt); font-weight: 600; font-size: .8rem; cursor: pointer; }
  .ag { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; border: 1px solid transparent;
    background: var(--sunk); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
  .ag.today { box-shadow: inset 0 0 0 2px var(--cobalt); }
  .ag.sel { background: var(--cobalt-soft); border-color: var(--cobalt); }
  .ag.past { opacity: .75; }
  .ag-d { display: flex; flex-direction: column; font-size: .72rem; color: var(--muted); line-height: 1.2; }
  .ag-d b { font-family: var(--f-mono); font-size: 1.1rem; color: var(--ink); font-weight: 500; }
  .ag-d .ct { width: 6px; height: 6px; border-radius: 50%; background: var(--chile); margin-top: 3px; }
  .ag-m { display: flex; flex-direction: column; min-width: 0; font-size: .8rem; line-height: 1.35; }
  .ag-m span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ag-m span:last-child { font-weight: 600; }
  .ag-p { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); text-align: right; }
}

/* Day level */
.dbig { display: flex; flex-direction: column; gap: 14px; }
.dbig-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.7rem; margin: 2px 0 0; text-wrap: balance; }
.dmeal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.dmeal h3 { margin: 0; font-size: 1.1rem; }
.dmeal details summary { cursor: pointer; color: var(--cobalt); font-weight: 600; }
.dmeal details[open] summary { margin-bottom: 8px; }
.dmeal .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.mh { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; border-radius: 6px; }
.mh:hover, .mh.sel { color: var(--cobalt); }
.costline { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 9px 12px; border-radius: 8px; background: var(--cobalt-soft); font-size: .9rem; }
.costline b { font-family: var(--f-mono); font-weight: 500; font-size: 1rem; white-space: nowrap; }
.shop li { align-items: flex-start; padding: 6px 0; }
.shop .it { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.shop .det { font-size: .76rem; color: var(--muted); }
.shop .buy { text-align: right; }
.adv.waste { color: var(--chile); font-weight: 600; }
.adv.freeze, .adv.keeps { color: var(--good); }
.price-note { margin: 0; }
</style>

        return '<option value="' + a.id + '"' + (a.id === r.id ? " selected" : "") + ">" + esc(a.name) + (a.cheat ? " (cheat)" : "") + ds + "</option>"; }).join("") + "</select>" +
      (ov[k] ? '<button class="btn" data-reset>Back to plan</button>' : "") + '</div><p class="kcal">Swaps are saved on this device only and don\'t change the rest of the rotation.</p></div>';
    return h + "</div>";
  }

  function viewWeek() {
    var mon = state.week, days = [], i;
    for (i = 0; i < 7; i++) days.push(addDays(mon, i));
    var plans = days.map(dayPlan).filter(Boolean);
    var h = '<div class="p-in"><div class="p-head"><div><div class="eyebrow">' + mon.d + " " + MONTHS[mon.m].slice(0, 3) + " – " + days[6].d + " " + MONTHS[days[6].m].slice(0, 3) + " " + days[6].y + '</div><h2 class="p-title">Week ' + isoWeek(mon.y, mon.m, mon.d) + '</h2></div><button class="sheet-close" data-close aria-label="Close">×</button></div>';
    if (!plans.length) return h + '<p class="empty">No plan for this week.</p></div>';
    var sum = { p1p: 0, p1k: 0, p2p: 0, p2k: 0, c: 0 };
    h += '<div class="tbl-wrap"><table><thead><tr><th>Day</th><th>P1 g</th><th>P1 kcal</th><th>P2 g</th><th>P2 kcal</th><th>Cost</th></tr></thead><tbody>';
    days.forEach(function (o) {
      var pl = dayPlan(o); if (!pl) return;
      sum.p1p += pl.people.p1.p; sum.p1k += pl.people.p1.k; sum.p2p += pl.people.p2.p; sum.p2k += pl.people.p2.k; sum.c += pl.cost;
      h += '<tr><td><button data-day="' + o.y + "," + o.m + "," + o.d + '">' + DOWS[dow(o)].slice(0, 3) + " " + o.d + "</button>" + (pl.cheat ? ' <span class="tag cheat">Cheat</span>' : "") + "</td><td>" + r0(pl.people.p1.p) + "</td><td>" + r0(pl.people.p1.k) + "</td><td>" + r0(pl.people.p2.p) + "</td><td>" + r0(pl.people.p2.k) + "</td><td>" + eur(pl.cost) + "</td></tr>";
    });
    var n = plans.length;
    h += '<tr class="avg"><td>Daily average</td><td>' + r0(sum.p1p / n) + "</td><td>" + r0(sum.p1k / n) + "</td><td>" + r0(sum.p2p / n) + "</td><td>" + r0(sum.p2k / n) + "</td><td>" + eur(sum.c / n) + "</td></tr></tbody></table></div>";
    h += '<div class="costline"><span>Food cost this week</span><b>≈ ' + eur(sum.c) + "</b></div>";
    h += '<p class="kcal">Targets: ' + PEOPLE.p1.label + " " + PEOPLE.p1.protein + " g, " + PEOPLE.p2.label + " " + PEOPLE.p2.protein + " g protein a day. Calories are estimates from the recipe weights.</p>";

    // shopping list with pack guidance
    var need = {}, pantry = {};
    function add(it, mult) {
      var c = CAT[it[0]]; if (!c) return;
      if (c.pantry || !PRICES[it[0]]) { pantry[c.n] = 1; return; }
      need[it[0]] = (need[it[0]] || 0) + Pricing.need(it) * mult;
    }
    plans.forEach(function (pl) {
      ["b", "l", "d"].forEach(function (s) { pl.meals[s].ing.forEach(function (it) { add(it, 1); }); });
      pl.snacks.forEach(function (sn) { sn.ing.forEach(function (it) { add(it, 2); }); }); // both snacks, for two
      pl.juice.ing.forEach(function (it) { add(it, 2); });
    });
    var bySec = {}, text = [], total = 0, risk = [], riskSum = 0, stock = [], stockUsed = 0;
    Object.keys(need).forEach(function (id) {
      if (need[id] <= 0) return;
      if (Pricing.isStock(id)) {
        var used = need[id] * Pricing.unitPrice(id), pk = PRICES[id].packs[PRICES[id].packs.length - 1];
        stockUsed += used; stock.push({ c: CAT[id], u: Pricing.packUnit(id), need: need[id], pk: pk, used: used });
        return;
      }
      var res = Pricing.bestPacks(id, need[id]), adv = Pricing.leftoverAdvice(id, res), u = Pricing.packUnit(id);
      total += res.cost;
      if (adv && adv.kind === "waste") { risk.push(CAT[id].n); riskSum += adv.value; }
      (bySec[CAT[id].s] = bySec[CAT[id].s] || []).push({ id: id, c: CAT[id], p: PRICES[id], res: res, adv: adv, u: u, need: need[id] });
    });
    var order = ["Meat", "Dairy & eggs", "Vegetables & fruit", "Bread & grains", "Tins & jars", "Frozen", "Other"];
    h += '<div class="sec shop"><div class="p-head"><h3>Shopping list</h3><button class="btn" id="copy">Copy list</button></div>';
    h += '<div class="costline"><span>Expected checkout, fresh items</span><b>≈ ' + eur(total) + "</b></div>";
    order.forEach(function (sec) {
      var list = bySec[sec]; if (!list) return;
      list.sort(function (a, b) { return a.c.n.localeCompare(b.c.n); });
      h += "<h4>" + sec + "</h4><ul>"; text.push(sec.toUpperCase());
      list.forEach(function (x) {
        var buy = x.res.loose ? fmtQty(x.res.buy, x.u) : x.res.packs.map(function (pk) { return pk[0] + " × " + fmtPack(pk[1][0], pk[1][1]); }).join(" + ");
        var detail = "uses " + fmtQty(x.need, x.u);
        if (!x.res.loose && x.res.left > 0.001) detail += " · " + fmtQty(x.res.left, x.u) + " left";
        if (x.adv) detail += ', <span class="adv ' + x.adv.kind + '">' + esc(x.adv.text) + "</span>";
        h += '<li><span class="it"><span>' + esc(x.c.n) + '</span><span class="det">' + detail + '</span></span><span class="buy">' + buy + "<br>" + eur(x.res.cost) + "</span></li>";
        text.push("- " + x.c.n + ": " + buy + " (" + eur(x.res.cost) + ")" + (x.adv ? ", " + x.adv.text : ""));
      });
      h += "</ul>";
    });
    if (stock.length) {
      stock.sort(function (a, b) { return a.c.n.localeCompare(b.c.n); });
      h += '<h4>Long-life items · buy when you run out</h4><ul>'; text.push("LONG-LIFE (BUY WHEN YOU RUN OUT)");
      stock.forEach(function (x) {
        var weeks = Math.round(x.pk[0] / x.need), lasts = "a " + fmtPack(x.pk[0], x.pk[1]) + " pack lasts " + (weeks <= 1 ? "about a week" : "about " + weeks + " weeks");
        h += '<li><span class="it"><span>' + esc(x.c.n) + '</span><span class="det">uses ' + fmtQty(x.need, x.u) + " this week · " + lasts + '</span></span><span class="buy">' + eur(x.pk[2]) + "<br>per pack</span></li>";
        text.push("- " + x.c.n + ": " + lasts + " (" + eur(x.pk[2]) + ")");
      });
      h += '</ul><p class="kcal">Long-life stock used this week ≈ ' + eur(stockUsed) + ". It counts toward the food cost but not the checkout total.</p>";
    }
    if (risk.length) h += '<p class="note-box">Likely to go to waste this week (≈ ' + eur(riskSum) + "): " + risk.map(esc).join(", ") + ". Plan these into the start of next week or swap a meal to use them up.</p>";
    var pk = Object.keys(pantry).sort();
    h += '<p class="kcal">Pack sizes are the cheapest mix that covers the week. Includes the morning juice and both optional snacks for two people each day.</p><h4>Check the pantry</h4><p class="pantry">' + pk.map(esc).join(", ") + "</p></div>";
    text.push("PANTRY: " + pk.join(", "));
    text.push("Expected checkout ≈ " + eur(total));
    state.shopText = "Week " + isoWeek(mon.y, mon.m, mon.d) + "\n" + text.join("\n");
    return h + priceNote() + "</div>";
  }

  function viewMonth() {
    var y = state.month.y, m = state.month.m, mp = monthPlans(y, m);
    var h = '<div class="p-in"><div class="p-head"><div><div class="eyebrow">Month summary</div><h2 class="p-title">' + MONTHS[m] + " " + y + '</h2></div><button class="sheet-close" data-close aria-label="Close">×</button></div>';
    if (!mp.length) return h + '<p class="empty">No plan for this month.</p></div>';
    var c = 0, p1 = 0, p2 = 0, cheat = 0, weeks = {};
    mp.forEach(function (x) {
      c += x.pl.cost; p1 += x.pl.people.p1.p; p2 += x.pl.people.p2.p; if (x.pl.cheat) cheat++;
      var mo = mondayOf(x.o), k = mo.y + "," + mo.m + "," + mo.d;
      weeks[k] = weeks[k] || { mon: mo, c: 0, n: 0 }; weeks[k].c += x.pl.cost; weeks[k].n++;
    });
    var n = mp.length;
    h += '<div class="people"><div class="person"><div class="lbl">Food cost this month</div><div class="num">≈ ' + eur(c, 0) + '</div><div class="kcal">' + eur(c / n) + ' a day on average</div></div>' +
      '<div class="person"><div class="lbl">Protein, daily average</div><div class="num">' + r0(p1 / n) + ' <small>/ ' + r0(p2 / n) + ' g</small></div><div class="kcal">' + PEOPLE.p1.label + " / " + PEOPLE.p2.label + " · " + cheat + " cheat nights</div></div></div>";
    h += '<div class="tbl-wrap"><table><thead><tr><th>Week</th><th>Days in month</th><th>Cost</th></tr></thead><tbody>';
    Object.keys(weeks).forEach(function (k) {
      var w = weeks[k];
      h += '<tr><td><button data-wk="' + k + '">Week ' + isoWeek(w.mon.y, w.mon.m, w.mon.d) + "</button></td><td>" + w.n + "</td><td>" + eur(w.c) + "</td></tr>";
    });
    h += "</tbody></table></div>";
    return h + priceNote() + "</div>";
  }

  function renderPanel() {
    var p = $("panel");
    p.innerHTML = state.view === "recipe" ? viewRecipe() : state.view === "week" ? viewWeek() : state.view === "month" ? viewMonth() : viewDay();
    p.scrollTop = 0;
    var sel = $("swap-sel");
    if (sel) sel.addEventListener("change", function () {
      var o = state.sel, k = Engine.key(o.y, o.m, o.d) + "|" + state.recipe, base = dayPlan(o).base[state.recipe].id;
      if (sel.value === base) delete ov[k]; else ov[k] = sel.value;
      saveOv(); renderMonths(); renderPanel();
    });
    var cp = $("copy");
    if (cp) cp.addEventListener("click", function () {
      var done = function () { cp.textContent = "Copied"; setTimeout(function () { cp.textContent = "Copy list"; }, 1500); };
      try { navigator.clipboard.writeText(state.shopText).then(done, function () { cp.textContent = "Copy not available"; }); } catch (e) { cp.textContent = "Copy not available"; }
    });
  }

  var mq = window.matchMedia("(min-width: 1100px)");
  function openSheet(v) { if (mq.matches) return; $("panel").classList.toggle("open", v); $("backdrop").hidden = !v; }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-day],[data-wk],[data-month],[data-recipe],[data-back],[data-close],[data-reset],[data-level],#backdrop");
    if (!t) return;
    if (t.hasAttribute("data-level")) {
      var lv = t.getAttribute("data-level"); if (lv === state.level) return;
      if (lv === "year") setLevel("year", "zout"); else if (lv === "month") setLevel("month", state.level === "day" ? "zout" : "zin");
      return;
    }
    if (t.id === "backdrop" || t.hasAttribute("data-close")) { openSheet(false); return; }
    if (t.hasAttribute("data-day")) { var a = t.getAttribute("data-day").split(",").map(Number); state.sel = { y: a[0], m: a[1], d: a[2] }; state.view = "day"; }
    else if (t.hasAttribute("data-wk")) { var w = t.getAttribute("data-wk").split(",").map(Number); state.week = { y: w[0], m: w[1], d: w[2] }; state.view = "week"; }
    else if (t.hasAttribute("data-month")) { var mm = t.getAttribute("data-month").split(",").map(Number); state.month = { y: mm[0], m: mm[1] }; state.view = "month"; }
    else if (t.hasAttribute("data-recipe")) { state.recipe = t.getAttribute("data-recipe"); state.view = "recipe"; }
    else if (t.hasAttribute("data-back")) { state.view = "day"; }
    else if (t.hasAttribute("data-reset")) { var o = state.sel; delete ov[Engine.key(o.y, o.m, o.d) + "|" + state.recipe]; saveOv(); }
    renderMonths(); renderPanel(); openSheet(true);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") openSheet(false); });

  function centerNow() {
    var t = new Date(TODAY.y, TODAY.m + state.offset, 1), el = $("m-" + t.getFullYear() + "-" + t.getMonth());
    if (el) el.scrollIntoView({ block: "center" });
  }
  $("prev").addEventListener("click", function () { step(-1); });
  $("next").addEventListener("click", function () { step(1); });
  $("zin").addEventListener("click", function () { zoomIn(null); });
  $("zout").addEventListener("click", function () { zoomOut(); });
  $("today").addEventListener("click", function () {
    state.offset = 0; state.sel = { y: TODAY.y, m: TODAY.m, d: TODAY.d }; state.focus = { y: TODAY.y, m: TODAY.m };
    if (state.level === "year") { state.view = "day"; renderMonths(); renderPanel(); centerNow(); openSheet(true); }
    else { saveLevel(); renderMonths(); renderPanel(); animate(null); }
  });

  // ---- Gestures: pinch to change level, swipe to move, taps unchanged ------
  var cal = $("cal"), pts = {}, pinch = null, swipe = null, suppressUntil = 0, wheelAcc = 0, wheelLock = 0;
  function ptsList() { return Object.keys(pts).map(function (k) { return pts[k]; }); }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  cal.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse") return;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    var l = ptsList();
    if (l.length === 2) { pinch = { d0: dist(l[0], l[1]), mx: (l[0].x + l[1].x) / 2, my: (l[0].y + l[1].y) / 2, r: 1 }; swipe = null; }
    else if (l.length === 1) swipe = { x: e.clientX, y: e.clientY };
  });
  cal.addEventListener("pointermove", function (e) {
    if (!pts[e.pointerId]) return;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (pinch) {
      var l = ptsList(); if (l.length < 2) return;
      pinch.r = dist(l[0], l[1]) / pinch.d0;
      var box = cal.getBoundingClientRect();
      cal.style.transformOrigin = (pinch.mx - box.left) + "px " + (pinch.my - box.top) + "px";
      cal.style.transform = "scale(" + Math.max(0.85, Math.min(1.2, pinch.r)) + ")";
    }
  });
  function endPointer(e) {
    if (!pts[e.pointerId]) return;
    var p0 = pts[e.pointerId]; delete pts[e.pointerId];
    if (pinch) {
      var r = pinch.r, mx = pinch.mx, my = pinch.my;
      cal.style.transform = ""; pinch = null; swipe = null; suppressUntil = Date.now() + 350;
      if (r > 1.18) zoomIn(targetAt(mx, my)); else if (r < 0.85) zoomOut();
      return;
    }
    if (swipe && e.type === "pointerup") {
      var dx = p0.x - swipe.x, dy = p0.y - swipe.y; swipe = null;
      if (state.level !== "year" && Math.abs(dx) > 70 && Math.abs(dy) < Math.abs(dx) * 0.6) { suppressUntil = Date.now() + 400; step(dx < 0 ? 1 : -1); }
    }
  }
  cal.addEventListener("pointerup", endPointer);
  cal.addEventListener("pointercancel", function (e) { delete pts[e.pointerId]; if (pinch && ptsList().length < 2) { cal.style.transform = ""; pinch = null; } swipe = null; });
  // Keep the browser's own page zoom out of the calendar (Safari), so the pinch reaches the app.
  ["gesturestart", "gesturechange"].forEach(function (n) { cal.addEventListener(n, function (e) { e.preventDefault(); }); });
  // A pinch or swipe never turns into a tap.
  document.addEventListener("click", function (e) { if (Date.now() < suppressUntil && cal.contains(e.target)) { e.stopPropagation(); e.preventDefault(); } }, true);
  // Trackpad pinch and Ctrl + scroll.
  cal.addEventListener("wheel", function (e) {
    if (!e.ctrlKey) return;
    e.preventDefault();
    if (Date.now() < wheelLock) return;
    wheelAcc += e.deltaY;
    if (wheelAcc < -40) { wheelAcc = 0; wheelLock = Date.now() + 450; zoomIn(targetAt(e.clientX, e.clientY)); }
    else if (wheelAcc > 40) { wheelAcc = 0; wheelLock = Date.now() + 450; zoomOut(); }
  }, { passive: false });
  document.addEventListener("keydown", function (e) {
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "select" || tag === "input" || tag === "textarea" || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "+" || e.key === "=") { e.preventDefault(); zoomIn(null); }
    else if (e.key === "-" || e.key === "_") { e.preventDefault(); zoomOut(); }
    else if (e.key === "ArrowLeft" && state.level !== "year") { e.preventDefault(); step(-1); }
    else if (e.key === "ArrowRight" && state.level !== "year") { e.preventDefault(); step(1); }
  });

  readLevel();
  if (state.level === "day" && mq.matches) { state.view = "week"; state.week = mondayOf(state.sel); }
  renderMonths(); renderPanel();
  if (state.level === "year") requestAnimationFrame(centerNow);
})();
</script>
